<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Product Showcase Gallery</h1>
    <button id="theme-toggle">🌙 Dark Mode</button>
  </header>

  <div class="gallery">
    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Product 1">
      <h2>Smart Watch</h2>
      <p>Modern smartwatch with fitness tracking.</p>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Product 2">
      <h2>Wireless Headphones</h2>
      <p>High-quality sound with noise cancellation.</p>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/250x180" alt="Product 3">
      <h2>Running Shoes</h2>
      <p>Comfortable shoes designed for performance.</p>
    </div>
  </div>

  
  <script src="script.js"></script>
</body>
</html>
